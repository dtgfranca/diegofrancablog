# URL do site
baseURL = "https://diegofranca.dev/"
relativeURLs = true

defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = true

[languages]
  [languages.pt]
    weight = 1
    languageName = "Português"

  [languages.en]
    weight = 2
    languageName = "English

# Configurações gerais
params.customCSS = ["css/custom.css"]

# Analistics
[params.google.analytics]
id = "G-TE926Z2M83"
[params]
  disqusShortname = "meu-shortname-disqus"
  enableLanguageSwitch = true

[services]
  [services.disqus]
    shortname = 'blog-diegofranca-dev'

# Menu
[menu]

[[menu.main]]
name = "Docs"
url = "/docs/"
weight = 1

[[menu.main]]
name = "About"
url = "/about/"
weight = 2

[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 3

