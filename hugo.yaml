# Hugo configuration file
title: Diego França Blog
baseURL: "https://diegofranca.dev/"

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

# Configuração do Disqus
services:
  disqus:
    shortname: 'blog-diegofranca-dev'

# Multilingual
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    languageName: English
    weight: 1
  pt:
    languageName: Português
    weight: 2

menu:
  main:
    - name: Language
      weight: 1
      params:
        type: language-switch
    - name: About
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://github.com/dtgfranca"
      weight: 3
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/dtgfranca"
      params:
        icon: github
    - name: Twitter
      weight: 7
      url: "https://x.com/dtgfranca"
      params:
        icon: x-twitter
    - name: LinkedIn
      weight: 8
      url: "https://www.linkedin.com/in/diego-thiago-guimar%C3%A3es-fran%C3%A7a-4a15bb28/"
      params:
        icon: linkedin

params:
  navbar:
    displayTitle: true
    displayLogo: false
  # Configuração adicional do Disqus
  disqusShortname: 'blog-diegofranca-dev'

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
